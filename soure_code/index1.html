<!DOCTYPE html>
<html>
<head>

</head>
<body style="font-family: Arial; background-color: #f4f6f9; text-align: center; padding-top: 50px;">
    
    <div style="background-color: white; width: 350px; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px #ccc;">
        <h2 style="color: #003366;">SecureBank Demo</h2>
        <h3 style="color: #333;">Customer Login</h3>
        
        <!-- Form submits to login.php using POST method[cite: 38] -->
